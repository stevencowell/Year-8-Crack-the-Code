<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><rect width="1200" height="640" rx="34" fill="#fffaf0"/><rect x="28" y="28" width="1144" height="584" rx="28" fill="#ffffff" stroke="#dce8ee" stroke-width="4"/><text x="70" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10263a">Trace a four-item LED array</text><g><rect x="290" y="220" width="140" height="140" rx="18" fill="#0f6d83"/><text x="360" y="282" text-anchor="middle" font-family="Arial" font-size="21" fill="white">index 0</text><text x="360" y="328" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="white">pin 8</text></g><g><rect x="450" y="220" width="140" height="140" rx="18" fill="#0f6d83"/><text x="520" y="282" text-anchor="middle" font-family="Arial" font-size="21" fill="white">index 1</text><text x="520" y="328" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="white">pin 9</text></g><g><rect x="610" y="220" width="140" height="140" rx="18" fill="#0f6d83"/><text x="680" y="282" text-anchor="middle" font-family="Arial" font-size="21" fill="white">index 2</text><text x="680" y="328" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="white">pin 10</text></g><g><rect x="770" y="220" width="140" height="140" rx="18" fill="#0f6d83"/><text x="840" y="282" text-anchor="middle" font-family="Arial" font-size="21" fill="white">index 3</text><text x="840" y="328" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="white">pin 11</text></g><text x="600" y="440" text-anchor="middle" font-family="Arial" font-size="23" fill="#10263a">4 values have valid indexes 0–3. The loop must stop before index 4.</text></svg>