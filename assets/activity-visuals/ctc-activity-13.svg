<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><rect width="1200" height="640" rx="34" fill="#fffaf0"/><rect x="28" y="28" width="1144" height="584" rx="28" fill="#ffffff" stroke="#dce8ee" stroke-width="4"/><text x="70" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10263a">Frequency changes perceived pitch</text><line x1="120" y1="390" x2="1080" y2="390" stroke="#071a2b" stroke-width="8"/><line x1="216" y1="330" x2="216" y2="450" stroke="#0f6d83" stroke-width="10"/><text x="216" y="300" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#10263a">150 Hz</text><text x="216" y="485" text-anchor="middle" font-family="Arial" font-size="19" fill="#10263a">LOW PITCH</text><line x1="472" y1="330" x2="472" y2="450" stroke="#ffb84d" stroke-width="10"/><text x="472" y="300" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#10263a">550 Hz</text><text x="472" y="485" text-anchor="middle" font-family="Arial" font-size="19" fill="#10263a">MID-RANGE PITCH</text><line x1="888" y1="330" x2="888" y2="450" stroke="#d95d4f" stroke-width="10"/><text x="888" y="300" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#10263a">1200 Hz</text><text x="888" y="485" text-anchor="middle" font-family="Arial" font-size="19" fill="#10263a">HIGH PITCH</text><text x="120" y="540" font-family="Arial" font-size="20" fill="#10263a">noTone(3) = sound stopped</text><text x="1080" y="540" text-anchor="end" font-family="Arial" font-size="20" fill="#10263a">higher frequency → higher perceived pitch</text></svg>