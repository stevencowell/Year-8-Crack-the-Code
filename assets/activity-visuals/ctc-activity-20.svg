<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><rect width="1200" height="640" rx="34" fill="#fffaf0"/><rect x="28" y="28" width="1144" height="584" rx="28" fill="#ffffff" stroke="#dce8ee" stroke-width="4"/><text x="70" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10263a">Build an evidence-based evaluation</text><rect x="100" y="155" width="1000" height="380" rx="24" fill="white" stroke="#071a2b" stroke-width="4"/><rect x="100" y="155" width="250" height="90" fill="#071a2b"/><text x="225" y="210" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">Criterion</text><rect x="350" y="155" width="250" height="90" fill="#071a2b"/><text x="475" y="210" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">Test evidence</text><rect x="600" y="155" width="250" height="90" fill="#071a2b"/><text x="725" y="210" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">Judgement</text><rect x="850" y="155" width="250" height="90" fill="#071a2b"/><text x="975" y="210" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">Feasible improvement</text><rect x="100" y="245" width="250" height="120" fill="white" stroke="#dce8ee"/><text x="225" y="310" text-anchor="middle" font-family="Arial" font-size="18" fill="#10263a">Responds to input</text><rect x="350" y="245" width="250" height="120" fill="white" stroke="#dce8ee"/><text x="475" y="310" text-anchor="middle" font-family="Arial" font-size="18" fill="#10263a">readings + states</text><rect x="600" y="245" width="250" height="120" fill="white" stroke="#dce8ee"/><text x="725" y="310" text-anchor="middle" font-family="Arial" font-size="18" fill="#10263a">Met / partly / not yet</text><rect x="850" y="245" width="250" height="120" fill="white" stroke="#dce8ee"/><text x="975" y="310" text-anchor="middle" font-family="Arial" font-size="18" fill="#10263a">specific next change</text><rect x="100" y="365" width="250" height="120" fill="#eef5f8" stroke="#dce8ee"/><text x="225" y="430" text-anchor="middle" font-family="Arial" font-size="18" fill="#10263a">Recovers to normal</text><rect x="350" y="365" width="250" height="120" fill="#eef5f8" stroke="#dce8ee"/><text x="475" y="430" text-anchor="middle" font-family="Arial" font-size="18" fill="#10263a">recovery result</text><rect x="600" y="365" width="250" height="120" fill="#eef5f8" stroke="#dce8ee"/><text x="725" y="430" text-anchor="middle" font-family="Arial" font-size="18" fill="#10263a">evidence-based</text><rect x="850" y="365" width="250" height="120" fill="#eef5f8" stroke="#dce8ee"/><text x="975" y="430" text-anchor="middle" font-family="Arial" font-size="18" fill="#10263a">retest boundary</text><text x="600" y="585" text-anchor="middle" font-family="Arial" font-size="21" fill="#10263a">A judgement is only strong when it names the criterion and cites the test evidence.</text></svg>