<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><rect width="1200" height="640" rx="34" fill="#fffaf0"/><rect x="28" y="28" width="1144" height="584" rx="28" fill="#ffffff" stroke="#dce8ee" stroke-width="4"/><text x="70" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10263a">A toggle changes stored state once per press</text><circle cx="330" cy="330" r="125" fill="#dce8ee" stroke="#071a2b" stroke-width="8"/><text x="330" y="320" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#10263a">STATE: OFF</text><text x="330" y="365" text-anchor="middle" font-family="Arial" font-size="20" fill="#10263a">stored Boolean = false</text><circle cx="870" cy="330" r="125" fill="#d8efe5" stroke="#2d8a67" stroke-width="8"/><text x="870" y="320" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#2d8a67">STATE: ON</text><text x="870" y="365" text-anchor="middle" font-family="Arial" font-size="20" fill="#10263a">stored Boolean = true</text><path d="M455 270C560 180 640 180 745 270" fill="none" stroke="#ffb84d" stroke-width="9"/><path d="M725 245L750 275L712 280" fill="#ffb84d"/><path d="M745 390C640 480 560 480 455 390" fill="none" stroke="#0f6d83" stroke-width="9"/><path d="M475 415L450 385L488 380" fill="#0f6d83"/><text x="600" y="190" text-anchor="middle" font-family="Arial" font-size="21" fill="#10263a">recognised press: invert state</text><text x="600" y="500" text-anchor="middle" font-family="Arial" font-size="21" fill="#10263a">next recognised press: invert again</text></svg>