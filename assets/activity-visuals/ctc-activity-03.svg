<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><rect width="1200" height="640" rx="34" fill="#fffaf0"/><rect x="28" y="28" width="1144" height="584" rx="28" fill="#ffffff" stroke="#dce8ee" stroke-width="4"/><text x="70" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10263a">Read the sketch in execution order</text><rect x="95" y="135" width="1010" height="420" rx="22" fill="#071a2b"/><rect x="125" y="165" width="950" height="46" rx="8" fill="transparent"/><text x="150" y="198" font-family="Consolas,monospace" font-size="23" fill="#38d9ff">void setup() {</text><rect x="125" y="223" width="950" height="46" rx="8" fill="transparent"/><text x="150" y="256" font-family="Consolas,monospace" font-size="23" fill="#38d9ff">  pinMode(8, OUTPUT);</text><rect x="125" y="281" width="950" height="46" rx="8" fill="transparent"/><text x="150" y="314" font-family="Consolas,monospace" font-size="23" fill="#38d9ff">}</text><rect x="125" y="339" width="950" height="46" rx="8" fill="#0f6d83"/><text x="150" y="372" font-family="Consolas,monospace" font-size="23" fill="#ffffff">void loop() {</text><rect x="125" y="397" width="950" height="46" rx="8" fill="transparent"/><text x="150" y="430" font-family="Consolas,monospace" font-size="23" fill="#38d9ff">  digitalWrite(8, HIGH);</text><rect x="125" y="455" width="950" height="46" rx="8" fill="transparent"/><text x="150" y="488" font-family="Consolas,monospace" font-size="23" fill="#38d9ff">  delay(500);</text><rect x="125" y="513" width="950" height="46" rx="8" fill="transparent"/><text x="150" y="546" font-family="Consolas,monospace" font-size="23" fill="#38d9ff">  digitalWrite(8, LOW);</text><rect x="125" y="571" width="950" height="46" rx="8" fill="transparent"/><text x="150" y="604" font-family="Consolas,monospace" font-size="23" fill="#38d9ff">  delay(500);</text><rect x="125" y="629" width="950" height="46" rx="8" fill="transparent"/><text x="150" y="662" font-family="Consolas,monospace" font-size="23" fill="#38d9ff">}</text><text x="1045" y="530" text-anchor="end" font-family="Arial" font-size="18" fill="#ffb84d">setup runs once · loop repeats</text></svg>