<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><rect width="1200" height="640" rx="34" fill="#fffaf0"/><rect x="28" y="28" width="1144" height="584" rx="28" fill="#ffffff" stroke="#dce8ee" stroke-width="4"/><text x="70" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10263a">Make every representation describe the same alarm</text><rect x="100" y="150" width="1000" height="82" rx="18" fill="#e8f7fb"/><text x="135" y="200" font-family="Arial" font-size="21" font-weight="700" fill="#0f6d83">PIN MAP</text><text x="340" y="200" font-family="Arial" font-size="20" fill="#10263a">A4 → sensor · 7 → button · 8–13 → LEDs · 3 → buzzer</text><rect x="100" y="255" width="1000" height="82" rx="18" fill="#dce8ee"/><text x="135" y="305" font-family="Arial" font-size="21" font-weight="700" fill="#0f6d83">IPO</text><text x="340" y="305" font-family="Arial" font-size="20" fill="#10263a">inputs → decision rule → alert outputs</text><rect x="100" y="360" width="1000" height="82" rx="18" fill="#e8f7fb"/><text x="135" y="410" font-family="Arial" font-size="21" font-weight="700" fill="#0f6d83">PSEUDOCODE</text><text x="340" y="410" font-family="Arial" font-size="20" fill="#10263a">read → compare → choose → update</text><rect x="100" y="465" width="1000" height="82" rx="18" fill="#dce8ee"/><text x="135" y="515" font-family="Arial" font-size="21" font-weight="700" fill="#0f6d83">CODE</text><text x="340" y="515" font-family="Arial" font-size="20" fill="#10263a">analogRead / digitalRead → if/else → outputs</text><path d="M1080 135V560" stroke="#2d8a67" stroke-width="8"/><text x="1060" y="590" text-anchor="end" font-family="Arial" font-size="20" font-weight="700" fill="#2d8a67">same system in every representation</text></svg>