<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><rect width="1200" height="640" rx="34" fill="#fffaf0"/><rect x="28" y="28" width="1144" height="584" rx="28" fill="#ffffff" stroke="#dce8ee" stroke-width="4"/><text x="70" y="92" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10263a">Compare complete LED cycles</text><line x1="120" y1="500" x2="1080" y2="500" stroke="#10263a" stroke-width="4"/><text x="90" y="220" text-anchor="end" font-family="Arial" font-size="22" font-weight="700" fill="#10263a">Pattern A</text><path d="M120 250V180H420V250H1120V180" fill="none" stroke="#0f6d83" stroke-width="12"/><text x="270" y="162" text-anchor="middle" font-family="Arial" font-size="18" fill="#0f6d83">300 ms ON</text><text x="770" y="282" text-anchor="middle" font-family="Arial" font-size="18" fill="#10263a">700 ms OFF</text><text x="90" y="345" text-anchor="end" font-family="Arial" font-size="22" font-weight="700" fill="#10263a">Pattern B</text><path d="M120 375V305H370V375H620V305" fill="none" stroke="#2d8a67" stroke-width="12"/><text x="245" y="287" text-anchor="middle" font-family="Arial" font-size="18" fill="#0f6d83">250 ms ON</text><text x="495" y="407" text-anchor="middle" font-family="Arial" font-size="18" fill="#10263a">250 ms OFF</text><text x="600" y="575" text-anchor="middle" font-family="Arial" font-size="21" fill="#10263a">One cycle = ON time + OFF time. Compare the complete pattern, not one delay.</text></svg>